<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>입장 확인 - 2026 AI 인사이트 포럼</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<style>
:root{
  --bg:#0B1030; --card:#161C46; --line:#2B3268;
  --violet:#7B5CFF; --blue:#28A0FD;
  --ok:#17B978; --warn:#F5A623; --err:#E8453C;
  --text:#F2F4FF; --muted:#9AA3D0;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;
  background:var(--bg);color:var(--text);
  min-height:100vh;word-break:keep-all;
  padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);
}
.wrap{max-width:520px;margin:0 auto;padding:16px 16px 40px}

header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0 14px}
header h1{font-size:16px;font-weight:800;letter-spacing:-.02em}
.stat{font-size:13px;color:var(--muted)}
.stat b{color:var(--text);font-weight:800}

/* 설정 */
.setup{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.setup label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px}
.setup input{
  width:100%;padding:11px 12px;border-radius:9px;border:1px solid var(--line);
  background:#0E1437;color:var(--text);font-size:13px;font-family:inherit;
}
.setup .row{display:flex;gap:8px;margin-top:10px}
.setup button{flex:1;padding:11px;border-radius:9px;border:0;cursor:pointer;
  background:var(--violet);color:#fff;font-size:14px;font-weight:700;font-family:inherit}
.setup button.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}
.hint{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.6}

/* 카메라 */
.cam-bar{display:flex;gap:8px;margin-bottom:10px}
.cam-bar select{
  flex:1;min-width:0;padding:11px 12px;border-radius:9px;border:1px solid var(--line);
  background:#0E1437;color:var(--text);font-size:13px;font-family:inherit;
}
.cam-bar button{
  flex:0 0 auto;padding:11px 16px;border-radius:9px;border:1px solid var(--line);
  background:var(--card);color:var(--text);font-size:13px;font-weight:700;
  cursor:pointer;font-family:inherit;white-space:nowrap;
}
.cam-bar button:active{background:var(--violet);border-color:var(--violet)}
.cam-wrap{position:relative}
#reader{border-radius:16px;overflow:hidden;background:#000;min-height:220px}
#reader video{width:100%!important;display:block}
.flip-fab{
  position:absolute;right:12px;bottom:12px;z-index:5;
  width:52px;height:52px;border-radius:50%;border:0;cursor:pointer;
  background:rgba(11,16,48,.82);color:#fff;font-size:20px;line-height:1;
  box-shadow:0 4px 16px rgba(0,0,0,.45);
}
.flip-fab:active{background:var(--violet)}
.cam-note{font-size:12px;color:var(--muted);margin-top:8px;text-align:center;line-height:1.6}

/* 결과 */
.result{
  margin-top:14px;border-radius:16px;padding:22px 18px;text-align:center;
  background:var(--card);border:1px solid var(--line);
}
.result.ok{background:rgba(23,185,120,.14);border-color:var(--ok)}
.result.dup{background:rgba(245,166,35,.14);border-color:var(--warn)}
.result.err{background:rgba(232,69,60,.14);border-color:var(--err)}
.r-icon{font-size:40px;line-height:1;margin-bottom:8px}
.r-title{font-size:24px;font-weight:900;letter-spacing:-.02em}
.r-name{font-size:30px;font-weight:900;margin:6px 0 4px}
.r-sub{font-size:14px;color:var(--muted);line-height:1.7}
.r-warn{
  margin-top:10px;padding:8px 12px;border-radius:8px;
  background:rgba(245,166,35,.18);color:#FFD28A;font-size:13px;font-weight:700;
}
.undo{
  margin-top:14px;padding:10px 18px;border-radius:999px;border:1px solid var(--line);
  background:transparent;color:var(--muted);font-size:13px;font-weight:700;
  cursor:pointer;font-family:inherit;
}

/* 최근 기록 */
.log{margin-top:18px}
.log h2{font-size:13px;font-weight:700;color:var(--muted);margin-bottom:8px}
.log ul{list-style:none;display:grid;gap:6px}
.log li{
  display:flex;justify-content:space-between;gap:10px;
  padding:10px 12px;border-radius:10px;background:var(--card);
  border:1px solid var(--line);font-size:13px;
}
.log li .t{color:var(--muted);font-size:12px}
.log li.dup{border-color:var(--warn)}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>입장 확인</h1>
    <p class="stat" id="stat"></p>
  </header>

  <div class="setup" id="setup">
    <label for="url">체크인 웹앱 주소 (/exec 로 끝나는 주소)</label>
    <input id="url" type="url" placeholder="https://script.google.com/macros/s/.../exec" autocomplete="off">
    <div class="row">
      <button id="start">카메라 시작</button>
      <button id="reset" class="ghost">주소 변경</button>
    </div>
    <p class="hint">주소는 이 기기에만 저장됩니다. 운영진 기기에서만 사용하십시오.</p>
  </div>

  <div class="cam-bar" id="camBar" style="display:none">
    <select id="cam" aria-label="카메라 선택"></select>
    <button id="flip" type="button">전환</button>
  </div>

  <div class="cam-wrap">
    <div id="reader"></div>
    <button class="flip-fab" id="flipFab" type="button" style="display:none" aria-label="카메라 전환">⇄</button>
  </div>
  <p class="cam-note" id="camNote" style="display:none"></p>

  <div class="result" id="result" style="display:none"></div>

  <div class="log" id="logBox" style="display:none">
    <h2>최근 확인</h2>
    <ul id="log"></ul>
  </div>

</div>

<script>
var KEY='aiforum2nd_checkin_url';
var $=function(id){return document.getElementById(id)};
var scanner=null, busy=false, lastText='', lastAt=0, logs=[];
var cams=[], camIndex=0, running=false;

function getUrl(){
  try{ return localStorage.getItem(KEY)||'' }catch(e){ return window._url||'' }
}
function setUrl(v){
  try{ localStorage.setItem(KEY,v) }catch(e){ window._url=v }
}

$('url').value=getUrl();

$('reset').onclick=function(){
  setUrl(''); $('url').value='';
  if(scanner){ scanner.stop().catch(function(){}); scanner=null; }
  running=false; cams=[];
  $('camBar').style.display='none';
  $('flipFab').style.display='none';
  $('camNote').style.display='none';
};

$('start').onclick=function(){
  var u=$('url').value.trim();
  if(!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(u)){
    alert('웹앱 주소를 확인해 주세요. /exec 로 끝나야 합니다.');
    return;
  }
  setUrl(u);
  startScan();
  refreshStat();
};

/* JSONP 호출 (구글 Apps Script 교차 출처 대응) */
function call(params, cb){
  var base=getUrl();
  if(!base){ cb({error:'웹앱 주소가 설정되지 않았습니다.'}); return; }
  var name='cb_'+Date.now()+'_'+Math.floor(Math.random()*1000);
  var done=false;
  window[name]=function(res){ done=true; cleanup(); cb(res); };
  var qs=Object.keys(params).map(function(k){
    return encodeURIComponent(k)+'='+encodeURIComponent(params[k]);
  }).join('&');
  var s=document.createElement('script');
  s.src=base+'?'+qs+'&callback='+name;
  s.onerror=function(){ if(!done){ cleanup(); cb({error:'서버에 연결하지 못했습니다.'}); } };
  document.body.appendChild(s);
  var timer=setTimeout(function(){ if(!done){ cleanup(); cb({error:'응답이 지연됩니다. 다시 시도해 주세요.'}); } },12000);
  function cleanup(){
    clearTimeout(timer);
    try{ delete window[name] }catch(e){ window[name]=undefined }
    if(s.parentNode) s.parentNode.removeChild(s);
  }
}

/* 카메라 목록을 불러와 선택 UI를 채웁니다 */
function startScan(){
  if(running) return;
  if(!scanner) scanner=new Html5Qrcode('reader');

  note('카메라 권한을 확인하는 중입니다...');

  // 권한을 먼저 받아야 카메라 목록과 이름을 가져올 수 있습니다.
  askPermission().then(listCameras).catch(function(err){
    note('카메라를 사용할 수 없습니다: ' + err);
    alert('카메라 권한이 필요합니다.\n주소창 왼쪽 자물쇠 아이콘에서 카메라를 허용으로 바꾼 뒤 다시 시도해 주세요.\n\n' + err);
  });
}

function askPermission(){
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    return Promise.reject('이 브라우저는 카메라를 지원하지 않습니다.');
  }
  return navigator.mediaDevices.getUserMedia({video:true}).then(function(stream){
    stream.getTracks().forEach(function(t){ t.stop(); });
  });
}

function note(msg){
  var el=$('camNote');
  el.style.display='block';
  el.textContent=msg;
}

function listCameras(){
  return Html5Qrcode.getCameras().then(function(list){
    cams = list || [];
    if(cams.length === 0){
      note('사용할 수 있는 카메라를 찾지 못했습니다.');
      alert('카메라를 찾지 못했습니다. 기기에 카메라가 있는지, 다른 앱이 사용 중이지 않은지 확인해 주세요.');
      return;
    }

    // 후면 카메라를 기본값으로 (없으면 첫 번째)
    camIndex = 0;
    for(var i=0;i<cams.length;i++){
      var l=(cams[i].label||'').toLowerCase();
      if(l.indexOf('back')>=0 || l.indexOf('rear')>=0 || l.indexOf('environment')>=0 || l.indexOf('후면')>=0){
        camIndex=i; break;
      }
    }

    var sel=$('cam');
    sel.innerHTML = cams.map(function(c,i){
      return '<option value="'+i+'">'+esc(camLabel(c,i))+'</option>';
    }).join('');
    sel.value = camIndex;
    $('camBar').style.display='flex';
    $('flip').style.display = cams.length>1 ? 'block' : 'none';
    $('flipFab').style.display = cams.length>1 ? 'block' : 'none';

    sel.onchange=function(){ switchCam(parseInt(sel.value,10)); };
    $('flip').onclick=nextCam;
    $('flipFab').onclick=nextCam;

    note(cams.length + '개의 카메라를 찾았습니다. 시작합니다...');
    launch(camIndex);
  });
}

function camLabel(c,i){
  var l=c.label||'';
  if(!l) return '카메라 '+(i+1);
  var low=l.toLowerCase();
  if(low.indexOf('front')>=0||low.indexOf('user')>=0||low.indexOf('전면')>=0) return '전면 카메라';
  if(low.indexOf('back')>=0||low.indexOf('rear')>=0||low.indexOf('환경')>=0||low.indexOf('후면')>=0) return '후면 카메라';
  return l.length>28 ? l.substring(0,28)+'...' : l;
}

function launch(idx){
  var id = cams[idx] ? cams[idx].id : null;
  if(!id) return;
  scanner.start(
    id,
    {fps:10, qrbox:{width:240,height:240}, aspectRatio:1.3333},
    onScan,
    function(){}
  ).then(function(){
    running=true;
    camIndex=idx;
    $('cam').value=idx;
    $('camNote').style.display='block';
    $('camNote').textContent='현재 ' + camLabel(cams[idx],idx) + ' 사용 중' +
      (cams.length>1 ? ' · 전환 버튼으로 바꿀 수 있습니다' : '');
  }).catch(function(err){
    running=false;
    alert('카메라를 시작하지 못했습니다.\n'+err);
  });
}

function switchCam(idx){
  if(idx===camIndex && running) return;
  if(!running){ launch(idx); return; }
  scanner.stop().then(function(){
    running=false;
    lastText='';
    launch(idx);
  }).catch(function(){
    running=false;
    launch(idx);
  });
}

function nextCam(){
  if(cams.length<2) return;
  switchCam((camIndex+1) % cams.length);
}

function onScan(text){
  var now=Date.now();
  if(busy) return;
  if(text===lastText && now-lastAt<3000) return;  // 같은 QR 연속 인식 방지
  lastText=text; lastAt=now; busy=true;

  call({action:'verify', data:text}, function(res){
    show(res, text);
    setTimeout(function(){ busy=false; }, 1200);
  });
}

function show(res, raw){
  var box=$('result');
  box.style.display='block';
  box.className='result';

  if(res.error){
    box.classList.add('err');
    box.innerHTML='<div class="r-icon">!</div><p class="r-title">오류</p><p class="r-sub">'+esc(res.error)+'</p>';
    beep(400); return;
  }
  if(!res.found){
    box.classList.add('err');
    box.innerHTML='<div class="r-icon">✕</div><p class="r-title">명단에 없습니다</p>'+
      '<p class="r-sub">현장 접수대로 안내해 주세요.</p>';
    beep(400); return;
  }
  if(res.duplicate){
    box.classList.add('dup');
    box.innerHTML='<div class="r-icon">!</div><p class="r-title">이미 입장</p>'+
      '<p class="r-name">'+esc(res.name)+'</p>'+
      '<p class="r-sub">입장 시각 '+esc(res.checkinTime||'')+'</p>'+
      '<button class="undo" id="undo">입장 기록 취소</button>';
    $('undo').onclick=function(){ undo(raw); };
    addLog(res.name,'중복',true);
    beep(600); return;
  }

  box.classList.add('ok');
  var warn = res.multiRegistered
    ? '<p class="r-warn">중복 접수 '+res.dupCount+'건 확인. 동반 입장 여부를 확인해 주세요.</p>' : '';
  box.innerHTML='<div class="r-icon">✓</div><p class="r-title">입장 확인</p>'+
    '<p class="r-name">'+esc(res.name)+'</p>'+
    '<p class="r-sub">'+esc(res.attendType||'')+'</p>'+warn+
    '<button class="undo" id="undo">입장 기록 취소</button>';
  $('undo').onclick=function(){ undo(raw); };
  addLog(res.name,'입장',false);
  beep(880);
  refreshStat();
}

function undo(raw){
  call({action:'cancel', data:raw}, function(res){
    var box=$('result');
    box.className='result';
    box.innerHTML='<div class="r-icon">↺</div><p class="r-title">'+
      (res.ok?'입장 기록을 취소했습니다':'취소하지 못했습니다')+'</p>'+
      '<p class="r-sub">'+esc(res.name||'')+'</p>';
    lastText=''; refreshStat();
  });
}

function addLog(name, label, dup){
  logs.unshift({name:name,label:label,dup:dup,
    t:new Date().toTimeString().substring(0,5)});
  logs=logs.slice(0,8);
  $('logBox').style.display='block';
  $('log').innerHTML=logs.map(function(l){
    return '<li class="'+(l.dup?'dup':'')+'"><span>'+esc(l.name)+' · '+l.label+'</span><span class="t">'+l.t+'</span></li>';
  }).join('');
}

function refreshStat(){
  call({action:'stat'}, function(res){
    if(res && res.ok){
      $('stat').innerHTML='입장 <b>'+res.checked+'</b> / 현장신청 '+res.onsite;
    }
  });
}

function esc(s){
  return String(s).replace(/[&<>"]/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];
  });
}

function beep(freq){
  try{
    var ctx=new (window.AudioContext||window.webkitAudioContext)();
    var o=ctx.createOscillator(), g=ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.frequency.value=freq; o.type='sine';
    g.gain.setValueAtTime(.18, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime+.18);
    o.start(); o.stop(ctx.currentTime+.2);
  }catch(e){}
}

if(getUrl()){ refreshStat(); }
</script>
</body>
</html>
