<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>입장 확인 - 2026 AI 인사이트 포럼</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<style>
:root{
  --bg:#0B1030; --card:#141A44; --card2:#1B2254; --line:#2B3268;
  --violet:#7B5CFF; --blue:#28A0FD; --grad:linear-gradient(90deg,#8B5CFF,#4B8DFF);
  --ok:#17B978; --warn:#F5A623; --err:#E8453C;
  --text:#F2F4FF; --muted:#9AA3D0;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;
  background:radial-gradient(1200px 600px at 80% -10%,rgba(123,92,255,.28),transparent 60%),
             radial-gradient(900px 500px at -10% 100%,rgba(40,160,253,.18),transparent 60%),
             var(--bg);
  color:var(--text);min-height:100vh;word-break:keep-all;
  padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);
}
.wrap{max-width:560px;margin:0 auto;padding:20px 18px 48px}

/* 헤더 */
.brand{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:6px 0 18px}
.brand .eyebrow{font-size:12px;font-weight:700;letter-spacing:.14em;color:var(--muted)}
.brand .eyebrow b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand h1{font-size:30px;font-weight:900;letter-spacing:-.03em;line-height:1.1;margin-top:4px}
.stat{text-align:right;font-size:12px;color:var(--muted);line-height:1.4}
.stat b{display:block;font-size:26px;font-weight:900;color:var(--text);letter-spacing:-.02em}

/* 시작 화면 */
.start{
  background:var(--card);border:1px solid var(--line);border-radius:20px;
  padding:34px 22px 26px;text-align:center;
}
.start .icon{
  width:76px;height:76px;margin:0 auto 16px;border-radius:22px;
  background:var(--grad);display:flex;align-items:center;justify-content:center;
  box-shadow:0 12px 30px rgba(123,92,255,.35);
}
.start .icon svg{width:38px;height:38px;color:#fff}
.start h2{font-size:21px;font-weight:800;letter-spacing:-.02em}
.start p{font-size:14px;color:var(--muted);margin-top:8px;line-height:1.7}
.btn-main{
  display:block;width:100%;margin-top:22px;padding:17px;
  border:0;border-radius:14px;cursor:pointer;font-family:inherit;
  background:var(--grad);color:#fff;font-size:17px;font-weight:800;letter-spacing:-.01em;
  box-shadow:0 10px 26px rgba(123,92,255,.4);
}
.btn-main:active{transform:scale(.985)}
.btn-sub{
  display:inline-block;margin-top:14px;background:none;border:0;cursor:pointer;
  color:var(--muted);font-size:13px;font-weight:600;font-family:inherit;text-decoration:underline;
}

/* 설정 */
.setup{display:none;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:12px}
.setup.open{display:block}
.setup label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px}
.setup input{
  width:100%;padding:11px 12px;border-radius:9px;border:1px solid var(--line);
  background:#0E1437;color:var(--text);font-size:13px;font-family:inherit;
}
.setup .row{display:flex;gap:8px;margin-top:10px}
.setup button{flex:1;padding:11px;border-radius:9px;border:0;cursor:pointer;
  background:var(--violet);color:#fff;font-size:14px;font-weight:700;font-family:inherit}
.setup button.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}
.hint{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.6}

/* 스캔 화면 */
.scan{display:none}
.scan.on{display:block}
.cam-bar{display:flex;gap:8px;margin-bottom:10px}
.cam-bar select{
  flex:1;min-width:0;padding:11px 12px;border-radius:10px;border:1px solid var(--line);
  background:var(--card);color:var(--text);font-size:13px;font-family:inherit;
}
.cam-bar button{
  flex:0 0 auto;padding:11px 16px;border-radius:10px;border:1px solid var(--line);
  background:var(--card);color:var(--text);font-size:13px;font-weight:700;
  cursor:pointer;font-family:inherit;white-space:nowrap;
}
.cam-bar button:active{background:var(--violet);border-color:var(--violet)}
.cam-wrap{position:relative;border-radius:18px;overflow:hidden;background:#000;border:1px solid var(--line)}
#reader{min-height:260px}
#reader video{width:100%!important;display:block}
.flip-fab{
  position:absolute;right:12px;bottom:12px;z-index:5;
  width:52px;height:52px;border-radius:50%;border:0;cursor:pointer;
  background:rgba(11,16,48,.85);color:#fff;font-size:20px;line-height:1;
  box-shadow:0 4px 16px rgba(0,0,0,.45);
}
.flip-fab:active{background:var(--violet)}
.cam-note{font-size:12px;color:var(--muted);margin-top:8px;text-align:center;line-height:1.6}

/* 결과 */
.result{
  margin-top:14px;border-radius:18px;padding:24px 18px;text-align:center;
  background:var(--card);border:1px solid var(--line);
}
.result.wait{color:var(--muted);font-size:14px}
.result.ok{background:rgba(23,185,120,.16);border-color:var(--ok)}
.result.dup{background:rgba(245,166,35,.16);border-color:var(--warn)}
.result.err{background:rgba(232,69,60,.16);border-color:var(--err)}
.r-icon{font-size:40px;line-height:1;margin-bottom:8px}
.r-title{font-size:22px;font-weight:900;letter-spacing:-.02em}
.r-name{font-size:32px;font-weight:900;margin:6px 0 4px;letter-spacing:-.02em}
.r-sub{font-size:14px;color:var(--muted);line-height:1.7}
.r-warn{margin-top:10px;padding:8px 12px;border-radius:8px;background:rgba(245,166,35,.2);color:#FFD28A;font-size:13px;font-weight:700}
.undo{
  margin-top:14px;padding:10px 18px;border-radius:999px;border:1px solid var(--line);
  background:transparent;color:var(--muted);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;
}

/* 최근 기록 */
.log{margin-top:18px}
.log h2{font-size:13px;font-weight:700;color:var(--muted);margin-bottom:8px}
.log ul{list-style:none;display:grid;gap:6px}
.log li{display:flex;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:10px;background:var(--card);border:1px solid var(--line);font-size:13px}
.log li .t{color:var(--muted);font-size:12px}
.log li.dup{border-color:var(--warn)}

.foot{margin-top:28px;text-align:center;font-size:12px;color:var(--muted)}
.foot button{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-family:inherit;font-size:12px}
</style>
</head>
<body>
<div class="wrap">

  <header class="brand">
    <div>
      <p class="eyebrow"><b>2026 AI 인사이트 포럼</b> · 2차</p>
      <h1>입장 확인</h1>
    </div>
    <p class="stat" id="stat"></p>
  </header>

  <!-- 시작 전 -->
  <section class="start" id="start">
    <div class="icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3M21 14v3h-3M14 21h3M21 21h-3"/></svg>
    </div>
    <h2>참석자 QR을 카메라에 비춰주세요</h2>
    <p>문자로 받으신 입장 QR코드를 확인합니다.<br>버튼을 누르면 카메라가 켜집니다.</p>
    <button class="btn-main" id="btnStart">입장 확인 시작</button>
    <button class="btn-sub" id="btnSetup">연결 설정</button>
  </section>

  <section class="setup" id="setup">
    <label for="url">체크인 웹앱 주소</label>
    <input id="url" type="url" autocomplete="off" spellcheck="false">
    <div class="row">
      <button id="save">저장</button>
      <button id="restore" class="ghost">기본값으로</button>
    </div>
    <p class="hint">보통은 바꾸실 필요가 없습니다. 웹앱을 새로 배포해 주소가 바뀐 경우에만 수정하십시오.</p>
  </section>

  <!-- 스캔 중 -->
  <section class="scan" id="scan">
    <div class="cam-bar" id="camBar">
      <select id="cam" aria-label="카메라 선택"></select>
      <button id="flip" type="button">전환</button>
    </div>
    <div class="cam-wrap">
      <div id="reader"></div>
      <button class="flip-fab" id="flipFab" type="button" style="display:none" aria-label="카메라 전환">⇄</button>
    </div>
    <p class="cam-note" id="camNote"></p>

    <div class="result wait" id="result">QR을 비추면 여기에 결과가 표시됩니다</div>

    <div class="log" id="logBox" style="display:none">
      <h2>최근 확인</h2>
      <ul id="log"></ul>
    </div>

    <p class="foot"><button id="btnStop">카메라 끄기</button></p>
  </section>

</div>

<script>
/* ========= 설정 ========= */
// 웹앱을 새로 배포해 주소가 바뀌면 이 값만 고치면 됩니다.
var DEFAULT_URL = 'https://script.google.com/macros/s/AKfycbwXdZ5uEA1dElYyC5n9KsqVRgqoZBAzi4f0SngmHKNFzF7rSJ9VCUKT0iEDFKFmk087jA/exec';

var KEY='aiforum2nd_checkin_url';
var $=function(id){return document.getElementById(id)};
var scanner=null, busy=false, lastText='', lastAt=0, logs=[];
var cams=[], camIndex=0, running=false;

function getUrl(){ try{ return localStorage.getItem(KEY)||DEFAULT_URL }catch(e){ return DEFAULT_URL } }
function setUrl(v){ try{ localStorage.setItem(KEY,v) }catch(e){} }

$('url').value=getUrl();

/* 설정 패널 */
$('btnSetup').onclick=function(){ $('setup').classList.toggle('open'); };
$('save').onclick=function(){
  var u=$('url').value.trim();
  if(!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(u)){
    alert('주소 형식을 확인해 주세요. /exec 로 끝나야 합니다.'); return;
  }
  setUrl(u); $('setup').classList.remove('open'); refreshStat();
};
$('restore').onclick=function(){ setUrl(DEFAULT_URL); $('url').value=DEFAULT_URL; };

/* 시작 / 정지 */
$('btnStart').onclick=function(){
  $('start').style.display='none';
  $('setup').classList.remove('open');
  $('scan').classList.add('on');
  startScan();
  refreshStat();
};
$('btnStop').onclick=function(){
  if(scanner && running){ scanner.stop().catch(function(){}); }
  running=false;
  $('scan').classList.remove('on');
  $('start').style.display='block';
};

/* JSONP 호출 */
function call(params, cb){
  var base=getUrl();
  var name='cb_'+Date.now()+'_'+Math.floor(Math.random()*1000);
  var done=false;
  window[name]=function(res){ done=true; cleanup(); cb(res); };
  var qs=Object.keys(params).map(function(k){ return encodeURIComponent(k)+'='+encodeURIComponent(params[k]); }).join('&');
  var s=document.createElement('script');
  s.src=base+'?'+qs+'&callback='+name;
  s.onerror=function(){ if(!done){ cleanup(); cb({error:'서버에 연결하지 못했습니다. 연결 설정을 확인해 주세요.'}); } };
  document.body.appendChild(s);
  var timer=setTimeout(function(){ if(!done){ cleanup(); cb({error:'응답이 지연됩니다. 다시 시도해 주세요.'}); } },12000);
  function cleanup(){ clearTimeout(timer); try{ delete window[name] }catch(e){ window[name]=undefined } if(s.parentNode) s.parentNode.removeChild(s); }
}

/* 카메라 */
function note(msg){ $('camNote').textContent=msg; }

function startScan(){
  if(running) return;
  if(!scanner) scanner=new Html5Qrcode('reader');
  note('카메라 권한을 확인하는 중입니다...');
  askPermission().then(listCameras).catch(function(err){
    var name = (err && err.name) ? err.name : String(err);
    var msg;
    if (name === 'NotAllowedError' || name === 'PermissionDeniedError') {
      msg = '카메라 권한이 거부되어 있습니다.\n\n' +
            '[PC 크롬] 주소창 왼쪽 아이콘 → 사이트 설정 → 카메라 → 허용\n' +
            '[갤럭시 크롬] 주소창 왼쪽 아이콘 → 권한 → 카메라 → 허용\n' +
            '[아이패드] 주소창 AA → 웹 사이트 설정 → 카메라 → 허용\n\n' +
            '바꾼 뒤 새로고침하고 다시 시도해 주세요.';
    } else if (name === 'NotFoundError' || name === 'DevicesNotFoundError') {
      msg = '이 기기에서 카메라를 찾지 못했습니다.\n\n' +
            '카메라가 없는 PC이거나, 윈도우 설정에서 카메라가 꺼져 있을 수 있습니다.\n' +
            '실제 운영할 태블릿이나 휴대폰에서 테스트해 주세요.';
    } else if (name === 'NotReadableError' || name === 'TrackStartError') {
      msg = '카메라를 다른 프로그램이 사용 중입니다.\n\n' +
            '줌, 팀즈, 카메라 앱 등을 닫은 뒤 다시 시도해 주세요.';
    } else if (name === 'SecurityError') {
      msg = '보안 연결(https)이 아니어서 카메라를 쓸 수 없습니다.\n' +
            '주소가 https:// 로 시작하는지 확인해 주세요.';
    } else {
      msg = '카메라를 시작하지 못했습니다.\n오류: ' + name + '\n' + ((err && err.message) ? err.message : '');
    }
    note('카메라 오류: ' + name);
    alert(msg);
  });
}
function askPermission(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia) return Promise.reject('이 브라우저는 카메라를 지원하지 않습니다.');
  return navigator.mediaDevices.getUserMedia({video:true}).then(function(st){ st.getTracks().forEach(function(t){t.stop();}); });
}
function listCameras(){
  return Html5Qrcode.getCameras().then(function(list){
    cams=list||[];
    if(!cams.length){ note('사용할 수 있는 카메라를 찾지 못했습니다.'); return; }
    camIndex=0;
    for(var i=0;i<cams.length;i++){
      var l=(cams[i].label||'').toLowerCase();
      if(l.indexOf('back')>=0||l.indexOf('rear')>=0||l.indexOf('environment')>=0||l.indexOf('후면')>=0){ camIndex=i; break; }
    }
    var sel=$('cam');
    sel.innerHTML=cams.map(function(c,i){ return '<option value="'+i+'">'+esc(camLabel(c,i))+'</option>'; }).join('');
    sel.value=camIndex;
    $('flip').style.display = cams.length>1?'block':'none';
    $('flipFab').style.display = cams.length>1?'block':'none';
    sel.onchange=function(){ switchCam(parseInt(sel.value,10)); };
    $('flip').onclick=nextCam; $('flipFab').onclick=nextCam;
    launch(camIndex);
  });
}
function camLabel(c,i){
  var l=c.label||''; if(!l) return '카메라 '+(i+1);
  var low=l.toLowerCase();
  if(low.indexOf('front')>=0||low.indexOf('user')>=0||low.indexOf('전면')>=0) return '전면 카메라';
  if(low.indexOf('back')>=0||low.indexOf('rear')>=0||low.indexOf('후면')>=0) return '후면 카메라';
  return l.length>28?l.substring(0,28)+'...':l;
}
function launch(idx){
  var id=cams[idx]?cams[idx].id:null; if(!id) return;
  scanner.start(id,{fps:10,qrbox:{width:240,height:240},aspectRatio:1.3333},onScan,function(){})
  .then(function(){
    running=true; camIndex=idx; $('cam').value=idx;
    note('현재 '+camLabel(cams[idx],idx)+' 사용 중'+(cams.length>1?' · 전환 버튼으로 바꿀 수 있습니다':''));
  }).catch(function(err){ running=false; alert('카메라를 시작하지 못했습니다.\n'+err); });
}
function switchCam(idx){
  if(idx===camIndex&&running) return;
  if(!running){ launch(idx); return; }
  scanner.stop().then(function(){ running=false; lastText=''; launch(idx); })
  .catch(function(){ running=false; launch(idx); });
}
function nextCam(){ if(cams.length<2) return; switchCam((camIndex+1)%cams.length); }

/* 스캔 처리 */
function onScan(text){
  var now=Date.now();
  if(busy) return;
  if(text===lastText&&now-lastAt<3000) return;
  lastText=text; lastAt=now; busy=true;
  call({action:'verify',data:text},function(res){ show(res,text); setTimeout(function(){busy=false;},1200); });
}
function show(res,raw){
  var box=$('result'); box.className='result';
  if(res.error){ box.classList.add('err'); box.innerHTML='<div class="r-icon">!</div><p class="r-title">오류</p><p class="r-sub">'+esc(res.error)+'</p>'; beep(400); return; }
  if(!res.found){ box.classList.add('err'); box.innerHTML='<div class="r-icon">✕</div><p class="r-title">명단에 없습니다</p><p class="r-sub">현장 접수대로 안내해 주세요.</p>'; beep(400); return; }
  if(res.duplicate){
    box.classList.add('dup');
    box.innerHTML='<div class="r-icon">!</div><p class="r-title">이미 입장</p><p class="r-name">'+esc(res.name)+'</p><p class="r-sub">입장 시각 '+esc(res.checkinTime||'')+'</p><button class="undo" id="undo">입장 기록 취소</button>';
    $('undo').onclick=function(){undo(raw);}; addLog(res.name,'중복',true); beep(600); return;
  }
  box.classList.add('ok');
  var warn=res.multiRegistered?'<p class="r-warn">중복 접수 '+res.dupCount+'건 확인. 동반 입장 여부를 확인해 주세요.</p>':'';
  box.innerHTML='<div class="r-icon">✓</div><p class="r-title">입장 확인</p><p class="r-name">'+esc(res.name)+'</p><p class="r-sub">'+esc(res.attendType||'')+'</p>'+warn+'<button class="undo" id="undo">입장 기록 취소</button>';
  $('undo').onclick=function(){undo(raw);}; addLog(res.name,'입장',false); beep(880); refreshStat();
}
function undo(raw){
  call({action:'cancel',data:raw},function(res){
    var box=$('result'); box.className='result';
    box.innerHTML='<div class="r-icon">↺</div><p class="r-title">'+(res.ok?'입장 기록을 취소했습니다':'취소하지 못했습니다')+'</p><p class="r-sub">'+esc(res.name||'')+'</p>';
    lastText=''; refreshStat();
  });
}
function addLog(name,label,dup){
  logs.unshift({name:name,label:label,dup:dup,t:new Date().toTimeString().substring(0,5)});
  logs=logs.slice(0,8); $('logBox').style.display='block';
  $('log').innerHTML=logs.map(function(l){ return '<li class="'+(l.dup?'dup':'')+'"><span>'+esc(l.name)+' · '+l.label+'</span><span class="t">'+l.t+'</span></li>'; }).join('');
}
function refreshStat(){
  call({action:'stat'},function(res){
    if(res&&res.ok){ $('stat').innerHTML='입장 인원<b>'+res.checked+'</b>현장 신청 '+res.onsite+'명'; }
  });
}
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function beep(freq){
  try{ var ctx=new (window.AudioContext||window.webkitAudioContext)(); var o=ctx.createOscillator(),g=ctx.createGain();
    o.connect(g); g.connect(ctx.destination); o.frequency.value=freq; o.type='sine';
    g.gain.setValueAtTime(.18,ctx.currentTime); g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.18);
    o.start(); o.stop(ctx.currentTime+.2); }catch(e){}
}
refreshStat();
</script>
</body>
</html>
